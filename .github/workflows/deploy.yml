name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache CC0 asset pack
        uses: actions/cache@v4
        with:
          path: |
            public/assets/models
            public/assets/textures
            public/assets/hdri
          key: assets-${{ hashFiles('scripts/fetch-assets.mjs') }}

      - name: Fetch CC0 asset pack
        run: node scripts/fetch-assets.mjs

      - name: Build for Pages
        run: npm run build
        env:
          DEPLOY_BASE: /dreamhouse-studio/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
